name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v7.0.1
      - name: Prepare website
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path.cwd()
          data = json.loads(Path('examples.json').read_text())
          ids = [clip['id'] for clip in data['clips']]
          assert ids and len(ids) == len(set(ids)), 'Invalid sample IDs'
          arms = {model['arm'] for model in data['models']}
          files = {'index.html', 'style.css', 'app.js', 'examples.json', '.nojekyll'}
          for clip in data['clips']:
              assert set(clip['audio']) == arms, 'Missing model audio'
              for name in clip['audio'].values():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] == 'audio' and path.suffix == '.wav'
                  assert path.resolve().is_relative_to(root)
                  with path.open('rb') as audio:
                      header = audio.read(12)
                  assert header[:4] == b'RIFF' and header[8:12] == b'WAVE'
                  files.add(name)
          for name in sorted(files):
              target = Path('_site') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
