[project]
name = "midi-repa"
version = "1.0.0"
description = "MIDI-REPA: Improving Text-to-Music Generation with Symbolic Representation Alignment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "numpy>=1.26,<2.1",
  "einops>=0.8",
  "einops-exts>=0.0.4",
  "omegaconf>=2.3",
  "safetensors>=0.4",
  "nitrous-ema==0.0.1",
  "transformers>=4.48,<5",
  "laion-clap",
  "huggingface-hub>=0.26,<1",
  "pyarrow>=15",
  "pretty-midi>=0.2.11",
  "soundfile>=0.12",
  "scipy>=1.11",
  "pyyaml>=6",
  "tqdm>=4.66",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
basic-pitch = ["librosa==0.11.0", "nnAudio==0.3.4", "mir-eval==0.8.2", "resampy==0.4.3"]
ccs = ["accelerate==1.14.0", "qwen-omni-utils==0.0.9", "pandas>=2"]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.uv.sources]
# The fork used by the ATTM baseline; also what produced every text feature in the paper.
laion-clap = { git = "https://github.com/hkchengrex/CLAP.git", rev = "590b52df03a5e480634b8714135d3534313be860" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midi_repa"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
